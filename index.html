<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta

    <title>ぴよぴよランド</title>
    <meta
      name="description"
      content="4さいの あそびの まち。⭐で まちが そだつよ。"
    />

    <!-- スマホ表示・ホーム画面追加まわり -->
    <meta name="theme-color" content="#FFF6E5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- SNS で共有した ときの みだし（OGP） -->
    <meta property="og:title" content="ぴよぴよランド" />
    <meta
      property="og:description"
      content="4さいの あそびの まち。⭐で まちが そだつよ。"

    <meta property="og:url" content="https://kerokero-1245.github.io/" />

    <!-- 絵文字ファビコン（インラインSVG data URI・🐥） -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='54' font-size='78' text-anchor='middle' dominant-baseline='central'>🐥</text></svg>"
    />
    <!-- ホーム画面の アイコン（クリーム地に 街の ぴよ assets/img/piyo.svg を のせて PNG に したもの） -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />

    <style>
      /* ═══════════════════════════════════════════════════════════
       ぴよぴよランド ―「⭐で そだつ まち」（街MVP）
       ・ビルド不要の静的 index.html 1枚（インラインCSS/JS/絵文字/SVG）
       ・外部CDN・外部送信ゼロ。保存は localStorage（タイトル よみあげ済みの しるし land.titleVoicePlayed だけ sessionStorage）
       ・設計の正典は docs/WORLD.md。数値・キー・文言はそこに従う
       ─ いろ・かたちは3アプリ（otsukai-meiro / piyopiyo-sansu / piyopiyo-kotoba）と統一
       ═══════════════════════════════════════════════════════════ */
      :root {
        --bg: #fff6e5; /* やわらかいクリーム背景（額縁） */
        --surface: #ffffff; /* カード */
        --text: #5b3a1e; /* こげ茶 */
        /* ↓ --text の RGB。こげ茶の かげは rgba(var(--text-rgb), α) で つくる */
        --text-rgb: 91, 58, 30;
        --subtext: #9b7b57;
        --border: #f0d9a8; /* やさしい枠線 */
        --orange: #ff9f45; /* メインのオレンジ */
        --green: #5fbf7a; /* 前向きなグリーン（こうえん） */
        --veg: #7cb342; /* やおやさんの はっぱグリーン（こうえんと べつ色） */
        --yellow: #ffd23f; /* アクセント黄 */
        --on-accent: #ffffff; /* いろじ（--accent）の うえの しろい もじ */
        --warm-rgb: 214, 158, 78; /* あたたかい かげの RGB */
        --shadow: 0 10px 26px rgba(var(--warm-rgb), 0.28);
        --shadow-soft: 0 8px 20px rgba(var(--text-rgb), 0.15);
        --shadow-press: 0 4px 12px rgba(var(--warm-rgb), 0.3);
        --radius: 28px;
        --focus-ring-width: 4px; /* キーボードの フォーカスの わ */
        --focus-ring-offset: 3px;
        --night-fade: 1.4s; /* そらと じめんが よるへ かわる はやさ（.scene・.ground） */
        /* かさなりの じゅんじょ（.scene の なか。ちいさい ほうが うしろ） */
        --z-stars: 1;
        --z-ground: 2;
        --z-path: 3;
        --z-deco: 4;
        --z-facilities: 12; /* どうせん（しせつ）は ぜったいに かくさない */
        --z-meter: 15;
        --z-nest: 19;
        --z-piyo: 20;
        --z-bubble: 21; /* ぴよの なか（.piyo が かさなりの たんい） */
        --z-confetti: 30;
        --z-veil: 40; /* よるの くらがり（いちばん うえ） */
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro",
          "Hiragino Sans", "Yu Gothic", "YuGothic", "Meiryo", sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        overflow: hidden; /* 横スクロール厳禁・1画面完結 */
      }

      .app {
        height: 100vh; /* svh 非対応ブラウザの 代替 */
        height: 100svh;
        display: flex;
        flex-direction: column;
        padding: max(8px, env(safe-area-inset-top)) 10px
          max(8px, env(safe-area-inset-bottom));
        gap: 8px;
      }

      /* ── うえの おび（ちいさなタイトル・🌙 おやすみ ボタン） ── */
      .topbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 4px;
      }
      /* チップ（.brand・.moon-btn・.bgm-btn に きょうつうの みため）。
       .chip-btn は おせる チップ（ボタン）。おおきさ・じの おおきさは それぞれの ルールで きめる */
      .chip {
        display: inline-flex;
        align-items: center;
        background: var(--surface);
        color: var(--text);
        border: 2px solid var(--border);
        border-radius: 999px;
        box-shadow: var(--shadow-soft);
      }
      .chip-btn {
        appearance: none;
        justify-content: center;
        line-height: 1;
        cursor: pointer;
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease;
      }
      .chip-btn:active {
        transform: scale(0.92);
        box-shadow: var(--shadow-press);
      }
      .chip-btn:focus-visible {
        outline: var(--focus-ring-width) solid var(--orange);
        outline-offset: var(--focus-ring-offset);
      }
      .brand {
        gap: 0.25em;
        padding: 5px 14px;
        font-weight: 800;
        font-size: clamp(15px, 4.2vw, 20px);
        white-space: nowrap;
      }
      .brand .b-chick {
        font-size: 1.15em;
      }

      .moon-btn {
        width: 46px;
        height: 46px;
        font-size: 24px;
      }

      /* うえの おびの みぎがわ（BGM チップ＋🌙 を まとめる） */
      .topbar-actions {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      /* ── BGM チップ（🔊/🔇・タップで ON/OFF・key land.bgm・既定ON）──
       シールポップの みための じゃまを しないよう ひかえめ。でも 子どもが おせる おおきさ */
      .bgm-btn {
        width: 42px;
        height: 42px;
        font-size: 21px;
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease,
          opacity 0.15s ease;
      }
      .bgm-btn.off {
        opacity: 0.55;
      } /* OFF は うすく（きえてる ことが わかる） */

      /* ── まち（1まいの ふうけい）──────────────────────────── */
      .scene {
        position: relative;
        flex: 1 1 auto;
        width: 100%;
        max-width: 920px;
        margin: 0 auto;
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow-soft);
        isolation: isolate;
        /* ひるの そら（うえ→ちへい で あたたかく） */
        background: linear-gradient(
          #aee4ff 0%,
          #cff0ff 34%,
          #eaf7ea 58%,
          #eaf7ea 60%
        );
        transition: background var(--night-fade) ease;
        touch-action: manipulation;
      }
      /* ── よる ── */
      .scene.night {
        background: linear-gradient(
          #141634 0%,
          #23244a 40%,
          #3a2b55 70%,
          #3a2b55 100%
        );
      }

      /* じめん（みどり） */
      .ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        top: 58%;
        background: linear-gradient(#8fd79b 0%, #6fc886 40%, #5fbf7a 100%);
        border-top-left-radius: 60% 22px;
        border-top-right-radius: 60% 22px;
        transition:
          filter var(--night-fade) ease,
          background var(--night-fade) ease;
        z-index: var(--z-ground);
      }
      .scene.night .ground {
        background: linear-gradient(#2f5a49 0%, #274c40 100%);
        filter: brightness(0.9);
      }

      /* ── ほし（よるだけ ひかる・シールポップ hoshi.svg） ── */
      .stars {
        position: absolute;
        inset: 0;
        z-index: var(--z-stars);
        pointer-events: none;
      }
      .star {
        position: absolute;
        width: 15px;
        height: 15px;
        background: url(assets/img/hoshi.svg) center/contain no-repeat;
        opacity: 0;
        transform: scale(0.4);
        transition:
          opacity 1s ease,
          transform 1s ease;
        filter: drop-shadow(0 0 4px rgba(255, 231, 150, 0.55));
      }
      .scene.night .star {
        opacity: 0.95;
        transform: scale(1);
        animation: twinkle 3.2s ease-in-out infinite;
      }

      /* ── みち（だんかい5で でる） ── */
      .path {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 40%;
        height: 30%;
        background: linear-gradient(#f3e2b8, #ebd3a0);
        clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%);
        opacity: 0;
        z-index: var(--z-path);
        transition: opacity 0.8s ease;
      }
      .path.on {
        opacity: 0.85;
      }
      .scene.night .path {
        filter: brightness(0.7);
      }

      /* ── かざり（絵文字スロット）──
       すべて DOM に あるが、reachedStage 以下だけ .on で みえる。
       あたらしく あいた ものは .grow で ぽん と とうじょう */
      .deco {
        position: absolute;
        /* おきば（scene きじゅん%）は JS が --x/--y に いれる。
         たてもち（しせつ 2＋1）では --px/--py が あれば そちらを つかう＝カードの うらに かくれない。
         よこ持ちスマホ（よこなが・せが 480px いか）では --lx/--ly が あれば そちらを つかう。
         カードや ぴよに かかる がめん だけ --spx/--sqx/--wlx（DECOS の sp/sq/wl）も つかう */
        left: var(--x);
        top: var(--y);
        transform: translate(-50%, -50%) scale(0.2);
        opacity: 0;
        line-height: 1;
        z-index: var(--z-deco);
        pointer-events: none;
        filter: drop-shadow(0 4px 4px rgba(var(--text-rgb), 0.18));
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
        will-change: transform;
      }
      .deco.on {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      .scene.night .deco {
        filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.3)) brightness(0.82);
      }

      /* かざりの こまかい うごき（ひかえめ） */
      .deco.sway.on {
        animation: sway 4.2s ease-in-out infinite;
      }
      .deco.float.on {
        animation: floaty 6s ease-in-out infinite;
      }
      .deco.float.slow.on {
        animation: floaty 9s ease-in-out infinite;
      }
      .deco.hop.on {
        animation: hopdeco 2.6s ease-in-out infinite;
      }
      .deco.wob.on {
        animation: wobble 5s ease-in-out infinite;
      }
      .deco.rainbow.on {
        animation: rbfade 1s ease both;
      }
      .deco.spark.on {
        animation: sparkle 1.6s ease-in-out infinite;
      }
      .deco.friend.on {
        animation: hopdeco 3s ease-in-out infinite;
      }
      /* あたらしく あいた ものは まず ぽん（上の こまかい うごきより つよく あてる）。
       ぽんが おわったら JS が .grow を はずし、いつもの うごきに もどる（JS の POP_MS = 750ms は この 0.7s ＋ 50ms） */
      .deco-layer .deco.on.grow {
        animation: pop 0.7s cubic-bezier(0.2, 1.4, 0.5, 1) both;
      }
      .deco-layer .deco.rainbow.on.grown {
        animation: none;
        opacity: 0.92;
      }

      /* いえの けむり */
      .smoke {
        position: absolute;
        left: 62%;
        top: -6%;
        font-size: 0.5em;
        opacity: 0;
      }
      .deco.on .smoke {
        animation: smoke 3.4s ease-in-out infinite;
      }

      /* ── 3つの おおきな どうせん（しせつ＝ゲームの いりぐち）を のせる たな ──
       ★ここは ぜったいに こわさない。まちの えんしゅつが おおいかくさない★
       flexで ならべ、ぜったいに かさならない・はみ出さない。
       たてもち・せのひくい がめん＝2まい＋1まい（2＋1）。よこなが＝3まい よこに。 */
      .facilities {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 15%;
        z-index: var(--z-facilities);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: center;
        gap: clamp(8px, 2.2vmin, 20px);
        padding: 0 clamp(10px, 3vw, 22px);
      }
      .facility {
        flex: 0 1 42%; /* たてもち: 2まいで 1れつ → 3まい目は 2れつ目へ（2＋1） */
        max-width: 46%;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(6px, 1.8vmin, 14px);
        text-decoration: none;
        color: var(--text);
        background: var(--surface);
        border: 4px solid var(--accent);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: clamp(10px, 3.4vmin, 22px) 8px;
        transition:
          transform 0.09s ease,
          box-shadow 0.09s ease;
      }
      .facility:active {
        transform: translateY(2px) scale(0.98);
        box-shadow: var(--shadow-press);
      }
      .facility:focus-visible {
        outline: var(--focus-ring-width) solid var(--accent);
        outline-offset: var(--focus-ring-offset);
      }
      .fac--park {
        --accent: var(--green);
      }
      .fac--cake {
        --accent: var(--orange);
      }
      .fac--shop {
        --accent: var(--veg);
      }

      .facility .f-emoji {
        filter: drop-shadow(0 4px 6px rgba(var(--text-rgb), 0.16));
      }
      .facility .f-name {
        display: inline-block;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 800;
        font-size: clamp(17px, 4.6vmin, 30px);
        line-height: 1.1;
        padding: 0.26em 0.8em;
        border-radius: 999px;
        white-space: nowrap;
      }
      /* よるの あかり（まどが ぽっと ともる） */
      .facility .f-glow {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          circle at 50% 42%,
          rgba(255, 209, 63, 0.55),
          rgba(255, 209, 63, 0) 62%
        );
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.2s ease;
      }
      .scene.night .facility {
        filter: brightness(0.96);
      }
      .scene.night .facility .f-glow {
        opacity: 1;
      }

      /* ぴよが しせつを さす ときの ふわっと めじるし */
      .facility.point::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: calc(var(--radius) + 6px);
        box-shadow:
          0 0 0 4px rgba(255, 210, 63, 0.9),
          0 0 22px 6px rgba(255, 210, 63, 0.55);
        animation: ring 1.1s ease-in-out infinite;
        pointer-events: none;
      }

      /* ── ぴよ（がめんない じょうちゅう・タップで はねる）── */
      .piyo {
        position: absolute;
        left: 50%;
        bottom: 4%;
        transform: translateX(-50%);
        z-index: var(--z-piyo);
        cursor: pointer;
        user-select: none;
        transition:
          left 0.9s cubic-bezier(0.4, 0.1, 0.3, 1),
          bottom 0.9s cubic-bezier(0.4, 0.1, 0.3, 1);
        touch-action: manipulation;
      }
      .piyo .p-body {
        display: block;
        filter: drop-shadow(0 5px 5px rgba(var(--text-rgb), 0.22));
        animation: bob 2.8s ease-in-out infinite;
        transform-origin: 50% 90%;
      }
      .piyo.hop .p-body {
        animation: piyohop 0.6s ease;
      }
      .piyo.cheer .p-body {
        animation: piyocheer 0.9s ease;
      }
      .piyo .p-crown {
        position: absolute;
        left: 50%;
        top: -0.55em;
        transform: translateX(-50%);
        font-size: clamp(22px, 6vmin, 40px);
        opacity: 0;
        transition: opacity 0.5s ease 0.2s;
        filter: drop-shadow(0 2px 2px rgba(var(--text-rgb), 0.25));
      }
      .piyo.to-nest {
        bottom: 2%;
      } /* よる：すへ トコトコ */
      .piyo.king .p-crown {
        opacity: 1;
      }
      .piyo .p-zzz {
        position: absolute;
        right: -0.4em;
        top: -0.5em;
        font-size: 0.5em;
        opacity: 0;
      }
      .piyo.sleep .p-body {
        animation: none;
        transform: rotate(6deg) scale(0.96);
      }
      .piyo.sleep .p-zzz {
        opacity: 1;
        animation: zzz 2.6s ease-in-out infinite;
      }

      /* ふきだし（ひとこと・ひらがな みじかく）。
       ぴよの よこに だす（うえに だすと しせつカードと ラベルに かぶる）。
       ぴよが がめんの みぎはんぶんに いる ときは ひだりがわ（.bub-l）へ */
      .bubble {
        position: absolute;
        left: calc(100% + 8px);
        bottom: 30%;
        transform: translateY(6px) scale(0.8);
        transform-origin: 0 50%;
        background: var(--surface);
        color: var(--text);
        border: 2px solid var(--border);
        border-radius: 16px;
        padding: 5px 12px;
        font-weight: 800;
        font-size: clamp(15px, 4.2vw, 21px);
        white-space: nowrap;
        box-shadow: var(--shadow-soft);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
        z-index: var(--z-bubble);
      }
      .bubble::after {
        content: "";
        position: absolute;
        right: 100%;
        top: 50%;
        transform: translateY(-50%);
        border: 7px solid transparent;
        border-right-color: var(--surface);
        margin-right: -1px;
      }
      .bubble.show {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .piyo.bub-l .bubble {
        left: auto;
        right: calc(100% + 8px);
        transform-origin: 100% 50%;
      }
      .piyo.bub-l .bubble::after {
        right: auto;
        left: 100%;
        border-right-color: transparent;
        border-left-color: var(--surface);
        margin-right: 0;
        margin-left: -1px;
      }
      /* はばの せまい がめん（320px など）＝ふきだしの よこの よはくを すこし へらし、
       いちばん ながい「わー ふえた！」でも シーンの みぎはしから はみ出さない */
      @media (max-width: 340px) {
        .bubble {
          padding: 5px 10px;
        }
      }

      /* すの おうち（よる ぴよが ねる ばしょ） */
      .nest {
        position: absolute;
        left: 50%;
        bottom: 2%;
        transform: translateX(-50%) scale(0.6);
        opacity: 0;
        z-index: var(--z-nest);
        transition:
          opacity 1s ease,
          transform 1s ease;
        pointer-events: none;
        filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.25));
      }
      .scene.night .nest {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }

      /* ── すすみ ドット（つぎの へんかまで・さいだい5こ）── */
      .meter {
        position: absolute;
        left: 50%;
        bottom: 1.5%;
        transform: translateX(-50%);
        display: flex;
        gap: 5px;
        z-index: var(--z-meter);
        opacity: 0.9;
        transition: opacity 0.5s ease;
      }
      .meter .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        border: 1.5px solid rgba(var(--text-rgb), 0.28);
        transition:
          background 0.3s ease,
          transform 0.3s ease;
      }
      .meter .dot.f {
        background: var(--yellow);
        border-color: rgba(var(--warm-rgb), 0.6);
        transform: scale(1.05);
      }
      .scene.night .meter {
        opacity: 0.35;
      }

      /* ── まちが そだった！の おいわい（かみふぶきの ⭐）── */
      .confetti {
        position: absolute;
        inset: 0;
        z-index: var(--z-confetti);
        pointer-events: none;
        overflow: hidden;
      }
      .confetti span {
        position: absolute;
        top: -8%;
        font-size: 22px;
        animation: fall 2.4s linear forwards;
      }

      /* ── よるの くらがり（タップで あさに もどる）── */
      .nightveil {
        position: absolute;
        inset: 0;
        z-index: var(--z-veil);
        background: rgba(10, 12, 30, 0);
        opacity: 1;
        pointer-events: none;
        transition: background 1.6s ease;
      }
      .scene.night .nightveil {
        pointer-events: auto;
        cursor: pointer;
      }
      .scene.night.slept .nightveil {
        background: rgba(10, 12, 30, 0.45);
      }

      /* ── ちいさな クレジット（ページ最下部・音声の出典）── */
      .credit {
        flex: 0 0 auto;
        text-align: center;
        font-size: 10px;
        line-height: 1.2;
        color: var(--subtext);
        opacity: 0.65;
        padding: 1px 8px 0;
        letter-spacing: 0.01em;
        user-select: none;
      }
      /* せまい がめんで おれる ときは「／」の あとで おる（すえの もじだけ はみ出さない） */
      .credit span {
        display: inline-block;
      }

      /* ── シールポップSVG（<img>で差し替え・viewBox200・白フチ焼き込み・フィルタ不使用）──
       素材repo https://github.com/kerokero-1245/piyo-assets ／ 見本 piyo-assets/reference/style-samples.html
       レイアウト・タップ領域・進行ロジックは不変。絵文字スロットと同じ位置に画像を差すだけ。 */
      .deco-img {
        display: block; /* サイズは <img width/height>（＝cfg.s px）で きまる */
        -webkit-user-drag: none;
        user-select: none;
        pointer-events: none;
      }
      /* たいよう↔つき の きりかえ（よるは たいようを かくし、つきを だす＝☀️の みえ残り修正） */
      .scene.night .deco.sun.on {
        opacity: 0;
      }
      .deco.moon.on {
        opacity: 0;
      }
      .scene.night .deco.moon.on {
        opacity: 1;
      }
      .scene.night .deco.moon {
        filter: drop-shadow(0 0 10px rgba(255, 247, 199, 0.5));
      }

      /* しせつカードの え（🌳🍰🥕→ ki/cake/ninjin） */
      .facility img.f-emoji {
        width: clamp(48px, 15vmin, 104px);
        height: auto;
      }

      /* ぴよ（p-body/p-crown/p-zzz）と す（nest） */
      .piyo img.p-body {
        width: clamp(40px, 12vmin, 76px);
        height: auto;
      }
      .piyo img.p-crown {
        width: clamp(26px, 6.6vmin, 44px);
        height: auto;
      }
      .piyo img.p-zzz {
        width: clamp(22px, 6vmin, 36px);
        height: auto;
      }
      .nest img {
        display: block;
        width: clamp(30px, 9vmin, 54px);
        height: auto;
      }

      /* ── アニメーション ─────────────────────────────── */
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      @keyframes piyohop {
        0% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-22px);
        }
        55% {
          transform: translateY(0);
        }
        70% {
          transform: translateY(-8px);
        }
        100% {
          transform: translateY(0);
        }
      }
      @keyframes piyocheer {
        0% {
          transform: translateY(0) rotate(0);
        }
        25% {
          transform: translateY(-26px) rotate(-8deg);
        }
        50% {
          transform: translateY(0) rotate(0);
        }
        70% {
          transform: translateY(-18px) rotate(8deg);
        }
        100% {
          transform: translateY(0) rotate(0);
        }
      }
      @keyframes zzz {
        0% {
          opacity: 0.3;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-4px);
        }
        100% {
          opacity: 0.3;
          transform: translateY(-8px);
        }
      }
      @keyframes pop {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.2);
        }
        60% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.25);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }
      @keyframes sway {
        0%,
        100% {
          transform: translate(-50%, -50%) rotate(-4deg);
        }
        50% {
          transform: translate(-50%, -50%) rotate(4deg);
        }
      }
      @keyframes floaty {
        0%,
        100% {
          transform: translate(-50%, -50%) translateY(0);
        }
        50% {
          transform: translate(-50%, -50%) translateY(-8px);
        }
      }
      @keyframes hopdeco {
        0%,
        100% {
          transform: translate(-50%, -50%) translateY(0);
        }
        40% {
          transform: translate(-50%, -50%) translateY(-9px);
        }
        60% {
          transform: translate(-50%, -50%) translateY(0);
        }
      }
      @keyframes wobble {
        0%,
        100% {
          transform: translate(-50%, -50%) rotate(-3deg);
        }
        50% {
          transform: translate(-50%, -50%) rotate(3deg);
        }
      }
      @keyframes rbfade {
        from {
          opacity: 0;
        }
        to {
          opacity: 0.92;
        }
      }
      @keyframes sparkle {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.15);
          opacity: 0.8;
        }
      }
      @keyframes smoke {
        0% {
          opacity: 0;
          transform: translateY(0) scale(0.7);
        }
        30% {
          opacity: 0.8;
        }
        100% {
          opacity: 0;
          transform: translateY(-16px) scale(1.1);
        }
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes ring {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes fall {
        0% {
          transform: translateY(0) rotate(0);
          opacity: 1;
        }
        100% {
          transform: translateY(115%) rotate(320deg);
          opacity: 0.9;
        }
      }

      /* うごきを へらす せってい（アクセシビリティ） */
      @media (prefers-reduced-motion: reduce) {
        .deco.sway.on,
        .deco.float.on,
        .deco.float.slow.on,
        .deco.hop.on,
        .deco.wob.on,
        .deco.spark.on,
        .deco.friend.on,
        .piyo .p-body,
        .scene.night .star,
        .piyo.sleep .p-zzz,
        .deco.grow,
        .deco.rainbow.on,
        .deco.on .smoke,
        .confetti span,
        .facility.point::after {
          animation: none !important;
        }
        .scene,
        .ground,
        .path,
        .deco,
        .facility .f-glow,
        .nest {
          transition-duration: 0.3s;
        }
        .piyo {
          transition: none;
        } /* ぴよの いどうも すっと きりかえる */
      }

      /* たてもち（しせつ 2＋1）での かざりの おきば */
      @media (orientation: portrait) {
        .deco {
          left: var(--px, var(--x));
          top: var(--py, var(--y));
        }
      }

      /* よこながの がめん（PC・タブレット・よこ持ち）＝3まい よこに ならべる */
      @media (orientation: landscape) {
        .facility {
          flex-basis: 30%;
          max-width: 32%;
        }
        /* カードの したの すきまが ひくいので、ぴよを すこし さげる
         （すすみドットの すぐ うえ。👑の ときは ドットが ないので いちばん したへ） */
        .piyo {
          bottom: calc(1.5% + 4px);
        }
        .piyo.to-nest {
          bottom: 1%;
        }
        .piyo.king,
        .piyo.king.to-nest {
          bottom: 0;
        }
      }

      /* せの ひくい たてもち（515×684 など）＝たなを 少し上げ、
       2れつ目の カードと ぴよの ふきだしが かさならないようにする */
      @media (orientation: portrait) and (max-height: 720px) {
        .facilities {
          bottom: 20%;
        }
      }

      /* せの ひくい たてもちでの かざりの おきば（たなが 20% に 上がり、そらの かざりが カードに かかる ため）。
       ほそい がめん（320×568 など）＝そらの かざりを カードより うえへ。おおきさは シーンの たかさに あわせて ちぢむ（--spc）。
       しかくい がめん（515×684 など）＝そらに すきまが ないので、かんらんしゃ・もくばは 2れつ目の りょうわきへ */
      @media (orientation: portrait) and (max-height: 720px) and (max-aspect-ratio: 13/20) {
        .scene {
          container-type: size;
        } /* cqh＝シーンの たかさ */
        .deco {
          left: var(--spx, var(--px, var(--x)));
          top: var(--spy, var(--py, var(--y)));
        }
        .deco .deco-img {
          max-width: calc(var(--spc, 999) * 1cqh);
          max-height: calc(var(--spc, 999) * 1cqh);
        }
      }
      @media (orientation: portrait) and (max-height: 720px) and (min-aspect-ratio: 13/20) {
        .deco {
          left: var(--sqx, var(--px, var(--x)));
          top: var(--sqy, var(--py, var(--y)));
        }
      }

      /* せの たかい よこなが（せが 481〜767px）＝カードの れつが 45〜52% から はじまり、
       き・いえ・こいのぼりが カードに、ひよこ・ふんすい・ベンチが カードの したの はしに かかる ため、そら／じめんへ よける */
      @media (orientation: landscape) and (min-height: 481px) and (max-height: 767px) {
        .deco {
          left: var(--wlx, var(--x));
          top: var(--wly, var(--y));
        }
      }

      /* せの ひくい がめん（よこ持ちスマホ など） */
      @media (max-height: 480px) {
        .brand {
          font-size: 15px;
          padding: 4px 10px;
        }
        .moon-btn {
          width: 40px;
          height: 40px;
          font-size: 20px;
        }
        .bgm-btn {
          width: 36px;
          height: 36px;
          font-size: 18px;
        }
        .facilities {
          bottom: 11%;
        }
      }

      /* よこ持ちスマホ（よこなが・せが 480px いか）での かざりの おきば。
       カードの れつが シーンの 42〜89% を よこいっぱいに つかうので、
       そらの かざりは カードより うえ（--lx/--ly）、じめんの かざり（.lg）は カードの した の おび（89〜100%）へ。
       おびは シーンの たかさの 11%（568×320 で 26px）しか ないので、じめんの かざりは おびに はいる おおきさまで ちぢめる。
       おびの まんなか y=94.5%（＝100−11/2）は JS の GROUND_BAND_Y（DECOS の l: [x, GROUND_BAND_Y]）。11% を かえたら そろえる */
      @media (orientation: landscape) and (max-height: 480px) {
        .scene {
          container-type: size;
        } /* cqh＝シーンの たかさ（ひたいおうの ブラウザでは もとの おおきさの まま） */
        .deco {
          left: var(--lx, var(--x));
          top: var(--ly, var(--y));
        }
        .deco.lg .deco-img {
          max-width: calc(11cqh - 2px);
          max-height: calc(11cqh - 2px);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="topbar">

          ><span class="b-chick">🐥</span>ぴよぴよランド</span

    <!-- BGM（オルゴール・ループ／piyo-assets 共通エンジン・同一オリジン同梱）。
       songs.js（window.PIYO_SONGS）→ engine.js（window.PiyoBgm）の順。外部参照なし。 -->
    <script src="assets/bgm/songs.js"></script>
    <script src="assets/bgm/engine.js"></script>
    <!-- 街の進行ロジック（だんかいの しきい値・たいこう禁止・ドット・ぴよの ゆうどう。DOM に ふれない 純関数。window.PiyoLand）。
       tests/land-core.test.js を node --test で テストする。下の インライン script より さきに よむ。 -->
    <script src="assets/js/land-core.js"></script>

    <script>
      (function () {
        "use strict";

        /* 進行ロジックが よめなかった ときは なにも せず ぬける（れいがいで とまらない）。
       しせつカードは 静的な <a href> なので、どうせんは のこる */
        var L = window.PiyoLand;
        if (!L) return;

        /* ── localStorage キー台帳（WORLD.md §7）。よむのは meiro/sansu/kotoba、
       かくのは land.* だけ ── */
        var IMG = "assets/img/"; // シールポップSVGの ばしょ（同一オリジン・クロスオリジン参照なし）
        var K = {
          meiro: "meiro.totalStars",
          sansu: "sansu.totalStars",
          kotoba: "kotoba.totalStars",
          reached: "land.reachedStage",
          lastSeen: "land.lastSeenStars",
          night: "land.lastNightDate",
          lastPoint: "land.lastPointed",
        };

        /* ほぞんの よみかき。localStorage が ふつう、sessionStorage は だい3引数に STORE_SESSION。
       storage へ さわる こと自体が れいがいに なる ブラウザ（プライベート・ブロック）でも とまらないよう、
       名前で うけとり、try の なかで window[…] を ひく。よめない ときは null（かく ときは なにも しない） */
        var STORE_LOCAL = "localStorage";
        var STORE_SESSION = "sessionStorage";
        function readStr(key, store) {
          try {
            return window[store || STORE_LOCAL].getItem(key);
          } catch (e) {
            return null;
          }
        }
        function writeStr(key, val, store) {
          try {
            window[store || STORE_LOCAL].setItem(key, String(val));
          } catch (e) {}
        }
        /* こわれた値・けつじょは かならず 0 あつかい（WORLD.md §3.2 / §7。かずの よみかたは L.parseCount） */
        function readNum(key) {
          return L.parseCount(readStr(key));
        }

        /* ── だんかい しきい値（WORLD.md §3.4・正典）・たいこう禁止・ドット・ぴよの ゆうどうの けいさんは
       assets/js/land-core.js（L = window.PiyoLand）。ここには ほぞんの よみかき・えがく・おと・タイマーを おく ── */

        /* ── じかん・いち・おとの 名前つきの 値（CSS と そろえて おく もの）── */
        var GROUND_BAND_Y = 94.5; // よこ持ちスマホの じめんの おびの まんなか y(%) ＝100 − 11/2（CSS の .facilities bottom: 11% の おび 89〜100%）
        var PIYO_HOME_X = 50; // ぴよの いつもの いち x(%)（CSS .piyo left: 50% と おなじ・がめんの まんなか）
        var POP_MS = 750; // かざりの ぽん（CSS pop 0.7s）が おわって .grow を はずす まで（0.7s ＋ 50ms の よゆう）
        var CONFETTI_MS = 3200; // かみふぶきを けす まで（CSS fall 2.4s ＋ さいだいの おくれ 0.84s ＝ 3.24s より 40ms はやく）
        var YAWN_ACTS = 42; // この かいすうの そうさで ぴよが あくび（WORLD.md §5 の 7〜8分の めやす）
        var SAY_MS = 1800; // ぴよの ひとことの ひょうじ じかん（say の ばあいの しょきち）
        var TONE_GAIN = 0.05; // こうかおんの おんりょう（tone の しょきち）

        /* ── かざりの はいち（けっていてき・らんすう なし）──
       st=だんかい, x/y=%（scene きじゅん）, s=がぞうの おおきさ px（<img> の width/height。え が よめない ときの 絵文字では font-size）, cls=うごき
       p=[x,y] は たてもち（しせつ 2＋1）での おきば。ない ものは x/y の まま。
       l=[x,y] は よこ持ちスマホ（よこなが・せが 480px いか）での おきば。lg=じめんの かざり（カードの した の おびに はいる おおきさに ちぢむ）。
       カードや ぴよに かかる がめんだけの おきば（ない ものは 上の おきばの まま）:
         sp=[x,y] せの ひくい ほそい たてもち（320×568 など。たなが 上がり、そらが ひくい）。spc=そこでの おおきさの 上げん（シーンの たかさの %）
         sq=[x,y] せの ひくい しかくい たてもち（515×684 など。カードが 大きく、そらに すきまが ない＝2れつ目の りょうわきへ）
         wl=[x,y] せの たかい よこなが（せが 481〜767px。800×500・1280×720 など。カードの れつが 45〜52% から はじまる）
       しせつカードの うらに かくれない ばしょ：そら（カードより うえ）／カードの した／

          L.meterDots(displayStage, fuel).forEach(function (filled) {
            var d = document.createElement("span");
            d.className = "dot" + (filled ? " f" : "");
            meterEl.appendChild(d);
          });
        }

        /* ── まちを えがく（reachedStage は たんちょう ぞうか＝たいこう禁止）── */
        function paint() {
          var vals = FACILITIES.map(function (f) {
            return { id: f.id, v: readNum(f.key) };
          });
          var fuel = vals.reduce(function (sum, x) {
            return sum + x.v;
          }, 0);

          var reachedPrev = readNum(K.reached); // まえに ひらいていた だんかい
          var displayStage = L.displayStageFor(reachedPrev, fuel); // たいこう禁止：さがっても もどさない

          // かざりの ひょうじ。まえに ひらいていた だんかい（reachedPrev）までは さいしょから みせる。
          // こんかい あたらしく あいた ぶんは かくした まま はじめ、celebrate() が .on と .grow を
          // いっしょに つけて ぽん と 1かいだけ だす（さきに みえてから ぽんで きえて でなおす ちらつきを ふせぐ）
          decoEls.forEach(function (d) {
            if (d.st <= reachedPrev) d.el.classList.add("on");
            else d.el.classList.remove("on");
          });
          if (displayStage >= L.PATH_STAGE) pathEl.classList.add("on");
          else pathEl.classList.remove("on");
          // 👑の つけはずしで ぴよの たかさが かわる（よこなが）。よみこみ直後に すべって みえないよう いどうなしで
          var piyoTr = piyo.style.transition;
          piyo.style.transition = "none";
          if (displayStage >= L.MAX_STAGE) piyo.classList.add("king");
          else piyo.classList.remove("king");
          void piyo.offsetWidth;
          piyo.style.transition = piyoTr;

          renderMeter(displayStage, fuel);

          // ほぞん（land.* のみ）
          writeStr(K.reached, displayStage);
          writeStr(K.lastSeen, fuel);

          return {
            fuel: fuel,
            vals: vals, // [{id, v}] しせつごとの ⭐（ぴよの ゆうどうに つかう）
            displayStage: displayStage,
            reachedPrev: reachedPrev,
          };
        }

        /* ── まちが そだった えんしゅつ（WORLD.md §3.5・またいだ ときだけ 1かい）── */
        function celebrate(fromStage, toStage) {
          // あたらしく あいた だんかいだけ .on と .grow を いっしょに つけて ぽん（paint() では かくした まま）。
          // .on の フェード（transition）が ぽんの うえに かさならないよう、つける あいだだけ transition を きる。
          // うごきを へらす せっていでは ぽんが ないので、ふつうに .on の フェードで でる
          var reduceMotion = false;
          try {
            reduceMotion = window.matchMedia(
              "(prefers-reduced-motion: reduce)",
            ).matches;
          } catch (e) {}
          decoEls.forEach(function (d) {
            if (d.st > fromStage && d.st <= toStage) {
              var el = d.el;
              el.classList.remove("grow");
              if (!reduceMotion) el.style.transition = "none";
              el.classList.add("on");
              el.classList.add("grow");
              void el.offsetWidth;
              el.style.transition = "";
            }
          });
          // ぽんが おわったら .grow を はずして いつもの うごき（ゆらゆら等）へ。
          // にじ（rbfade＝うすく でる）は もう いちど でなおさないよう .grown で うすさだけ そろえる
          setTimeout(function () {
            decoEls.forEach(function (d) {
              if (!d.el.classList.contains("grow")) return;
              if (d.el.classList.contains("rainbow"))
                d.el.classList.add("grown");
              d.el.classList.remove("grow");
            });
          }, POP_MS);
          piyoCheer();
          flashFace("piyo-yorokobi", 1100);
          say(SAY_GROW, 2400);
          burstConfetti();
          sndGrow();
        }

        /* ── ぴよの ゆうどう（ひかえめ・いちどに ひとつだけ・WORLD.md §2.1）──
       ⭐が いちばん すくない しせつを さす。ならんだら まえと ちがう しせつへ ── */
        function pointTarget(vals) {
          // vals: [{id:'park',v:meiro},{id:'cake',v:sansu},{id:'shop',v:kotoba}]
          // えらびかた（⭐が いちばん すくない・ならんだら まえと ちがう しせつへ ローテーション）は L.pickPointTarget。
          // ここは ほぞん（land.lastPointed）の よみかきだけ
          var target = L.pickPointTarget(vals, readStr(K.lastPoint));
          writeStr(K.lastPoint, target);
          return target;
        }
        /* しせつの よこ位置（scene基準%）を じっそくして かえす。
       レイアウト（2＋1／よこ3れつ）が かわっても ぴよが ただしく さす */
        function facCenterPct(card) {
          try {
            var sr = scene.getBoundingClientRect();
            var cr = card.getBoundingClientRect();
            if (!sr.width) return PIYO_HOME_X;
            var cx = ((cr.left + cr.width / 2 - sr.left) / sr.width) * 100;
            return Math.max(14, Math.min(86, cx));
          } catch (e) {
            return PIYO_HOME_X;
          }
        }
        /* ぴよの よこ位置（scene基準%）。みぎはんぶんに いる ときは ふきだしを ひだりがわに だす */
        function setPiyoX(pct) {
          piyo.style.left = pct + "%";
          piyo.classList.toggle("bub-l", pct > 55);
        }
        var pointTimer = null;
        function clearPoint() {
          FACILITIES.forEach(function (f) {
            f.el.classList.remove("point");
          });
        }
        function doPoint(state) {
          if (isNight) return;
          var t = pointTarget(state.vals);
          var card = facilityEl(t);
          clearPoint();
          card.classList.add("point");
          // ぴよが その しせつの ほうへ ちょっと よる（じっそくした よこ位置へ）
          setPiyoX(facCenterPct(card));
          piyoHop();

          // つぎの へんかまで あと すこしなら「もうすこし」、ふだんは「こっちこっち」
          var near = L.isNearNextStage(state.displayStage, state.fuel);
          say(near ? SAY_NEAR : SAY_POINT);

          setTimeout(function () {
            clearPoint();
            setPiyoX(PIYO_HOME_X);
          }, 2400);
        }

        /* ── アイドル：たまに ゆうどう（そうさが ないとき）── */
        var idleTimer = null;
        var lastAct = Date.now();
        function scheduleIdle(state) {
          if (idleTimer) clearTimeout(idleTimer);
          idleTimer = setTimeout(function tick() {
            if (!isNight && Date.now() - lastAct > 9000) {
              doPoint(state);
            }
            idleTimer = setTimeout(tick, 15000);
          }, 15000);
        }
        function noteAct() {
          lastAct = Date.now();
        }

        /* ── よる モード（WORLD.md §5・こていシーケンス）── */
        var isNight = false;
        var nightTimers = [];
        function clearNightTimers() {
          nightTimers.forEach(clearTimeout);
          nightTimers = [];
        }

        function goNight() {
          if (isNight) return;
          isNight = true;
          clearPoint();
          if (idleTimer) clearTimeout(idleTimer);
          bubble.classList.remove("show");
          // 1) そらが よるへ・ほしが つく
          scene.classList.add("night");
          writeStr(K.night, L.todayStr());
          sndSleep();
          bgm.stopBgm(2); // BGM は 2秒かけて しずかにフェードアウト（おやすみ）
          // 2) ぴよが すへ トコトコ
          nightTimers.push(
            setTimeout(function () {
              setPiyoX(PIYO_HOME_X);
              piyo.classList.add("to-nest");
            }, 1200),
          );
          // 3) まるまって💤・「またあしたね」
          nightTimers.push(
            setTimeout(function () {
              piyo.classList.add("sleep");
              setPiyoFace("piyo-nemui");
              say(SAY_NIGHT, 6000);
            }, 2500),
          );
          // 4) しずかに くらく（タップで すぐ あさへ）
          nightTimers.push(
            setTimeout(function () {
              scene.classList.add("slept");
            }, 4000),
          );
        }

        function goMorning() {
          if (!isNight) return;
          isNight = false;
          clearNightTimers();
          scene.classList.remove("night");
          scene.classList.remove("slept");
          piyo.classList.remove("sleep");
          setPiyoFace("piyo");
          piyo.classList.remove("to-nest");
          setPiyoX(PIYO_HOME_X);
          say(SAY_MORNING, 1600);
          piyoHop();
          startBgmSafe(); // あさに もどったら BGM 再開（このジェスチャ文脈で・OFFなら鳴らない）
          noteAct();
          scheduleIdle(currentState);
        }

        /* ── そうさ カウント（ながく あそんだら やさしく あくび・WORLD.md §5）── */
        var actCount = 0;
        function bumpAct() {
          noteAct();
          actCount++;
          if (actCount === YAWN_ACTS && !isNight) {
            setTimeout(function () {
              if (isAwake()) {
                say(SAY_SLEEPY);
                flashFace("piyo-nemui", 2000);
              }
            }, 800);
          }
        }

        /* ── イベント ── */

        // 初回タップ（がめんの どこでも）で ①BGM を開始（冪等・OFFなら鳴らない）、
        // ②タイトルを 1セッション1回 よみあげる。
        // capture で 各ボタンの click より先に走らせ、初回だけ タップ音と かさならないよう抑制。
        // BGM チップを おした ときは start しない（トグル側で 制御・二度がけ・ブリップ回避）。
        // よるの あいだは どこを タップしても BGM は さいかいしない（あさに もどる タップで さいかい）。
        document.addEventListener(
          "click",
          function (e) {
            var onBgmBtn = false;
            try {
              onBgmBtn = !!(
                e &&
                e.target &&
                e.target.closest &&
                e.target.closest("#bgmBtn")
              );
            } catch (e2) {}
            if (!onBgmBtn) startBgmSafe();
            if (playTitleVoice()) {
              suppressTapSfx = true;
              setTimeout(function () {
                suppressTapSfx = false;
              }, 80);
            }
          },
          true,
        );

        // ── BGM チップ：タップで ON/OFF（既定ON・key land.bgm・localStorage 永続）──
        if (bgmBtn) {
          bgmBtn.addEventListener("click", function () {
            var next = !bgmWant;
            bgmWant = next;
            try {
              if (next) ensureActx(); // ONは このジェスチャ文脈で ctx を用意してから
              if (!next) {
                bgm.setBgmEnabled(false); // OFF→ すぐ stopBgm（よるでも）
              } else if (!isNight) {
                bgm.setBgmEnabled(true); // ON→ 予定曲(land)を 即再開
                bgm.startBgm("land"); // 最初のタップが チップでも 鳴らす（冪等）
              } // よるの ON は あさに もどる ときに 反映（startBgmSafe）
            } catch (e) {}
            writeStr(BGM_KEY, next ? "1" : "0");
            renderBgmBtn();
            noteAct();
          });
        }

        piyo.addEventListener("click", function () {
          if (isNight) {
            goMorning();
            return;
          }
          piyoHop();
          say(SAY_TAP[Math.floor(Math.random() * SAY_TAP.length)], 1500);
          sndTap();
          bumpAct();
        });
        piyo.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            piyo.click();
          }
        });

        moonBtn.addEventListener("click", function () {
          bumpAct();
          goNight();
        });
        nightveil.addEventListener("click", function () {
          goMorning();
        });

        // しせつの タップ：おと＋そうさカウント（リンクせんいは そのまま）
        FACILITIES.forEach(function (f) {
          f.el.addEventListener("click", function () {
            bumpAct();
            sndGo();
          });
        });

        // ページを はなれて もどった とき（bfcache）＝あさに もどす
        window.addEventListener("pageshow", function (e) {
          if (e.persisted) {
            location.reload();
          }
        });

        /* ── しょきか ── */
        renderBgmBtn(); // BGM チップの みため（保存された ON/OFF を反映）
        var currentState = paint();

        // まちが そだったか？（reachedPrev → displayStage を またいだら 1かい）
        if (currentState.displayStage > currentState.reachedPrev) {
          setTimeout(function () {
            celebrate(currentState.reachedPrev, currentState.displayStage);
          }, 650);
        } else {
          // ふだんの らいほう：あさの あいさつ
          setTimeout(function () {
            say(SAY_MORNING, 1600);
            piyoHop();
          }, 500);
        }

        scheduleIdle(currentState);
      })();
    </script>
  </body>
</html>
