# push（main）と PR で、整形（Prettier）・lint（eslint）・テスト（node --test）・HTML の書き方（htmlhint）・リンク切れ（lychee）を検査する。
# 配信（GitHub Pages）には関与しない。
name: 検査（整形・lint・テスト・HTML・リンク切れ）

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: 整形の検査（Prettier）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: lint の検査（eslint）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: テスト（node --test）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # tests/copies.test.js は node_modules の piyo-assets（正本）を読むので、依存を入れてから node --test で tests/ の *.test.js を流す
      - run: npm test

  html:
    name: HTML の検査（htmlhint）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # ルールはリポジトリ直下の .htmlhintrc（htmlhint の既定ルールと同じ 10 本）。
      # htmlhint はローカル（npx）で使っている版に固定する（新しい版でルールが変わって CI だけ落ちるのを防ぐ）
      - run: npx --yes htmlhint@1.9.2 "**/*.html"

  links:
    name: リンク切れの検査（lychee）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # /otsukai-meiro/ など同じオリジンの別リポジトリへのリンクと相対リンクは、公開 URL を基点に解決する
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --base-url https://kerokero-1245.github.io
            --accept 200,429
            '**/*.html'
          fail: true
